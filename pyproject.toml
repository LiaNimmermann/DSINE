[project]
name = "dsine-rdr2"
version = "0.1.0"
description = "DSINE environment for benchmarking RDR2 surface normals"
requires-python = ">=3.10,<3.11"
dependencies = [
    "geffnet>=1.0.2",
    "numpy>=1.24,<2",
    "opencv-python-headless>=4.10",
    "pillow>=10",
    "torch>=2.1",
    "torchvision>=0.16",
    "tqdm>=4.66",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
